name: Job alerts

on:
  schedule:
    - cron: "17 * * * *"  # hourly; an off-peak minute starts more reliably than :00
  workflow_dispatch:      # adds a "Run workflow" button for manual runs

permissions:
  contents: write         # lets the run commit seen.txt

concurrency: job-alerts   # one run at a time, so seen.txt never conflicts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
      - name: Commit seen.txt
        if: always()      # also after partial failures, so sent jobs are not re-sent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update seen jobs"
          git pull --rebase
          git push
